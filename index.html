<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Music Room - Equalizer Cegiełkowy</title>
    
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Montserrat:wght@700&family=Pirata+One&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: "Montserrat", sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #titleText {
            position: absolute;
            top: 40px; 
            width: 100%;
            text-align: center;
            font-family: "Pirata One", "Cinzel Decorative", serif; 
            font-size: 75px; 
            letter-spacing: 4px;
            color: #ffffff;
            z-index: 5;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 
                         0 0 20px #ff0055, 
                         0 0 40px #7f00ff;
            opacity: 0.95;
        }
        #startButton {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 35px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(45deg, #ff007f, #7f00ff);
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
            z-index: 10;
            font-family: "Montserrat", sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div id="titleText">Music Room</div>
    <button id="startButton">Uruchom wizualizator</button>
    <canvas id="visualizer"></canvas>

    <script>
        const startButton = document.getElementById('startButton');
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        startButton.addEventListener('click', async () => {
            startButton.style.display = 'none';

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioCtx.createMediaStreamSource(stream);
                const analyser = audioCtx.createAnalyser();

                analyser.smoothingTimeConstant = 0.60; 
                analyser.fftSize = 256; 
                
                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);

                const numberOfBars = 20; 
                const currentHeights = new Float32Array(numberOfBars);
                const peakHeights = new Float32Array(numberOfBars); 
                const peakHoldTimers = new Float32Array(numberOfBars); 

                source.connect(analyser);

                let lastTime = performance.now();

                function draw(currentTime) {
                    requestAnimationFrame(draw);

                    let deltaTime = (currentTime - lastTime) / 1000;
                    if (deltaTime > 0.1) deltaTime = 0.1; 
                    lastTime = currentTime;

                    analyser.getByteFrequencyData(dataArray);

                    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

                    const barWidth = window.innerWidth / numberOfBars;
                    const usableBufferLength = Math.floor(bufferLength * 0.7); 
                    const sampleSize = usableBufferLength / numberOfBars;

                    const speedUp = 20;  
                    const speedDown = 11; 

                    // --- PARAMETRY CEGIEŁEK (EQUALIZERA LED) ---
                    const brickHeight = 12;   // Wysokość pojedynczej cegiełki w pikselach
                    const brickGap = 4;       // Czarna przerwa między cegiełkami w pikselach
                    const totalBrickStep = brickHeight + brickGap; // Całkowity krok jednej cegiełki

                    const peakHoldTime = 0.35; 
                    const peakFallSpeed = 450; 

                    for (let i = 0; i < numberOfBars; i++) {
                        let sum = 0;
                        const startIndex = Math.floor(i * sampleSize);
                        const endIndex = Math.floor((i + 1) * sampleSize);
                        let count = 0;

                        for (let j = startIndex; j < endIndex; j++) {
                            if(dataArray[j] !== undefined) {
                                sum += dataArray[j];
                                count++;
                            }
                        }
                        const averageVolume = count > 0 ? sum / count : 0;
                        
                        // Maksymalna wysokość słupa dopasowana do wielokrotności cegiełek
                        const targetHeight = (averageVolume / 255) * window.innerHeight * 1.3;

                        if (targetHeight > currentHeights[i]) {
                            currentHeights[i] += (targetHeight - currentHeights[i]) * speedUp * deltaTime;
                        } else {
                            currentHeights[i] += (targetHeight - currentHeights[i]) * speedDown * deltaTime;
                        }

                        if (currentHeights[i] > window.innerHeight) currentHeights[i] = window.innerHeight;

                        const barHeight = currentHeights[i];
                        const hue = (i / numberOfBars) * 360;
                        
                        // Logika wiszącej cegiełki szczytowej
                        if (barHeight > peakHeights[i]) {
                            peakHeights[i] = barHeight;
                            peakHoldTimers[i] = peakHoldTime;
                        } else {
                            if (peakHoldTimers[i] > 0) {
                                peakHoldTimers[i] -= deltaTime;
                            } else {
                                peakHeights[i] -= peakFallSpeed * deltaTime;
                                if (peakHeights[i] < 0) peakHeights[i] = 0;
                            }
                        }

                        const x = i * barWidth;

                        // RYSOWANIE SŁUPA JAKO ZBIÓR OSOBNYCH CEGIEŁEK
                        ctx.fillStyle = `hsl(${hue}, 95%, 50%)`;
                        
                        // Obliczamy ile pełnych cegiełek mieści się w obecnej wysokości dźwięku
                        const numberOfBricksInBar = Math.floor(barHeight / totalBrickStep);

                        for (let b = 0; b < numberOfBricksInBar; b++) {
                            const yPos = window.innerHeight - (b * totalBrickStep) - brickHeight;
                            // Rysujemy pojedynczy segment słupa
                            ctx.fillRect(x, yPos, barWidth - 4, brickHeight);
                        }

                        // RYSOWANIE POJEDYNCZEJ CEGIEŁKI SZCZYTOWEJ (WIDMO)
                        ctx.fillStyle = `hsl(${hue}, 100%, 65%)`;
                        if (peakHeights[i] > 0.5) {
                            // Zaokrąglamy pozycję cegiełki szczytowej do siatki innych cegiełek, żeby idealnie pasowała
                            const peakBrickIndex = Math.floor(peakHeights[i] / totalBrickStep);
                            const peakYPos = window.innerHeight - (peakBrickIndex * totalBrickStep) - brickHeight;
                            
                            // Rysuj tylko, jeśli jest powyżej obecnego słupka cegiełek
                            if (peakBrickIndex >= numberOfBricksInBar) {
                                ctx.fillRect(x, peakYPos, barWidth - 4, brickHeight);
                            }
                        }
                    }
                }

                requestAnimationFrame((time) => {
                    lastTime = time;
                    draw(time);
                });

            } catch (err) {
                alert('Błąd dostępu do mikrofonu: ' + err.message);
                startButton.style.display = 'block';
            }
        });
    </script>
</body>
</html>
